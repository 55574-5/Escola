<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro Escolar — EMEB Mario Martins de Almeida</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f4f4; color: #333; }

  .topo { background: #1a73e8; color: white; padding: 20px 24px; }
  .topo h1 { font-size: 18px; font-weight: 600; }
  .topo p { font-size: 13px; opacity: 0.85; margin-top: 4px; }

  .menu { display: flex; gap: 8px; padding: 16px 24px; background: white; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
  .menu button { padding: 8px 18px; border: 1.5px solid #1a73e8; border-radius: 20px; background: white; color: #1a73e8; font-size: 13px; cursor: pointer; font-weight: 500; transition: all 0.15s; }
  .menu button:hover { background: #e8f0fe; }
  .menu button.ativo { background: #1a73e8; color: white; }

  .container { max-width: 680px; margin: 24px auto; padding: 0 16px; }

  .form-card { background: white; border-radius: 8px; border: 1px solid #ddd; padding: 24px; }
  .form-titulo { font-size: 16px; font-weight: 600; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #1a73e8; color: #1a73e8; }

  .campo { margin-bottom: 16px; }
  .campo label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
  .campo input, .campo select, .campo textarea {
    width: 100%; padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 14px; font-family: Arial, sans-serif; color: #333;
    transition: border-color 0.15s;
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus {
    outline: none; border-color: #1a73e8;
  }
  .campo textarea { resize: vertical; min-height: 80px; }

  .linha-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .linha-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  .btn-enviar { width: 100%; padding: 11px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
  .btn-enviar:hover { background: #1558b0; }
  .btn-enviar:disabled { background: #aaa; cursor: not-allowed; }

  .sucesso { display: none; text-align: center; padding: 32px 16px; }
  .sucesso .icone { font-size: 48px; margin-bottom: 12px; }
  .sucesso h2 { font-size: 18px; color: #1a73e8; margin-bottom: 6px; }
  .sucesso p { font-size: 13px; color: #666; }
  .sucesso .protocolo { font-size: 12px; color: #999; margin-top: 10px; }
  .btn-novo { margin-top: 16px; padding: 9px 24px; background: white; border: 1.5px solid #1a73e8; color: #1a73e8; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 500; }

  .aba { display: none; }
  .aba.visivel { display: block; }
</style>
</head>
<body>

<div class="topo">
  <h1>EMEB Mario Martins de Almeida</h1>
  <p>Sistema de Registro Escolar</p>
</div>

<div class="menu">
  <button onclick="trocarAba('brigas')" id="btn-brigas">⚡ Brigas</button>
  <button onclick="trocarAba('busca')" id="btn-busca">🔍 Busca Ativa</button>
  <button onclick="trocarAba('reunioes')" id="btn-reunioes">👥 Reuniões</button>
  <button onclick="trocarAba('ocorrencias')" id="btn-ocorrencias">📋 Ocorrências</button>
</div>

<div class="container">

  <!-- BRIGAS -->
  <div class="aba" id="aba-brigas">
    <div class="form-card">
      <div class="form-titulo">⚡ Registro de Briga</div>
      <div id="form-brigas">
        <div class="linha-3">
          <div class="campo"><label>Data</label><input type="date" id="b-data"></div>
          <div class="campo"><label>Horário</label><input type="time" id="b-hora"></div>
          <div class="campo"><label>Turno</label>
            <select id="b-turno"><option value="">Selecione</option><option>Manhã</option><option>Tarde</option><option>Integral</option></select>
          </div>
        </div>
        <div class="linha-2">
          <div class="campo"><label>Aluno 1</label><input type="text" id="b-aluno1" placeholder="Nome completo"></div>
          <div class="campo"><label>Turma</label><input type="text" id="b-turma1" placeholder="Ex: 5º A"></div>
        </div>
        <div class="linha-2">
          <div class="campo"><label>Aluno 2</label><input type="text" id="b-aluno2" placeholder="Nome completo"></div>
          <div class="campo"><label>Turma</label><input type="text" id="b-turma2" placeholder="Ex: 4º B"></div>
        </div>
        <div class="campo"><label>Local da briga</label>
          <select id="b-local"><option value="">Selecione</option><option>Sala de aula</option><option>Pátio / Recreio</option><option>Corredor</option><option>Banheiro</option><option>Cantina</option><option>Portão / Entrada</option><option>Outro</option></select>
        </div>
        <div class="campo"><label>Descrição do ocorrido</label><textarea id="b-descricao" placeholder="Descreva o que aconteceu..."></textarea></div>
        <div class="linha-2">
          <div class="campo"><label>Pais foram comunicados?</label>
            <select id="b-pais"><option value="">Selecione</option><option>Sim</option><option>Não</option><option>Tentativa sem sucesso</option></select>
          </div>
          <div class="campo"><label>Encaminhamento</label>
            <select id="b-encaminhamento"><option value="">Selecione</option><option>Nenhum</option><option>Coordenação</option><option>Direção</option><option>Conselho Tutelar</option><option>UBS / Saúde</option></select>
          </div>
        </div>
        <div class="campo"><label>Responsável pelo registro</label><input type="text" id="b-responsavel" placeholder="Nome do professor ou funcionário"></div>
        <button class="btn-enviar" onclick="enviar('Brigas', {aba:'Brigas', data: v('b-data'), hora: v('b-hora'), turno: v('b-turno'), aluno1: v('b-aluno1'), turma1: v('b-turma1'), aluno2: v('b-aluno2'), turma2: v('b-turma2'), local: v('b-local'), descricao: v('b-descricao'), pais_comunicados: v('b-pais'), encaminhamento: v('b-encaminhamento'), responsavel: v('b-responsavel')}, ['b-aluno1','b-responsavel'])">Salvar registro</button>
      </div>
      <div class="sucesso" id="suc-brigas">
        <div class="icone">✅</div>
        <h2>Registro salvo com sucesso!</h2>
        <p id="info-brigas"></p>
        <p class="protocolo" id="prot-brigas"></p>
        <button class="btn-novo" onclick="novoRegistro('brigas')">Novo registro</button>
      </div>
    </div>
  </div>

  <!-- BUSCA ATIVA -->
  <div class="aba" id="aba-busca">
    <div class="form-card">
      <div class="form-titulo">🔍 Busca Ativa</div>
      <div id="form-busca">
        <div class="linha-2">
          <div class="campo"><label>Data</label><input type="date" id="ba-data"></div>
          <div class="campo"><label>Turno</label>
            <select id="ba-turno"><option value="">Selecione</option><option>Manhã</option><option>Tarde</option><option>Integral</option></select>
          </div>
        </div>
        <div class="linha-2">
          <div class="campo"><label>Nome do aluno</label><input type="text" id="ba-aluno" placeholder="Nome completo"></div>
          <div class="campo"><label>Turma / Série</label><input type="text" id="ba-turma" placeholder="Ex: 3º B"></div>
        </div>
        <div class="campo"><label>Motivo da ausência (se conhecido)</label>
          <select id="ba-motivo"><option value="">Selecione</option><option>Doença</option><option>Problema familiar</option><option>Trabalho infantil</option><option>Violência doméstica</option><option>Desconhecido</option><option>Outro</option></select>
        </div>
        <div class="campo"><label>Dias consecutivos faltando</label><input type="number" id="ba-dias" placeholder="Ex: 5" min="1"></div>
        <div class="campo"><label>Contato realizado com a família?</label>
          <select id="ba-contato"><option value="">Selecione</option><option>Sim — por telefone</option><option>Sim — visita domiciliar</option><option>Não conseguiu contato</option><option>Não realizado</option></select>
        </div>
        <div class="campo"><label>Observações</label><textarea id="ba-obs" placeholder="Informações adicionais..."></textarea></div>
        <div class="campo"><label>Responsável pelo registro</label><input type="text" id="ba-responsavel" placeholder="Nome do professor ou funcionário"></div>
        <button class="btn-enviar" onclick="enviar('BuscaAtiva', {aba:'BuscaAtiva', data: v('ba-data'), turno: v('ba-turno'), aluno: v('ba-aluno'), turma: v('ba-turma'), motivo: v('ba-motivo'), dias_faltando: v('ba-dias'), contato_familia: v('ba-contato'), observacoes: v('ba-obs'), responsavel: v('ba-responsavel')}, ['ba-aluno','ba-responsavel'])">Salvar registro</button>
      </div>
      <div class="sucesso" id="suc-busca">
        <div class="icone">✅</div>
        <h2>Registro salvo com sucesso!</h2>
        <p id="info-busca"></p>
        <p class="protocolo" id="prot-busca"></p>
        <button class="btn-novo" onclick="novoRegistro('busca')">Novo registro</button>
      </div>
    </div>
  </div>

  <!-- REUNIÕES -->
  <div class="aba" id="aba-reunioes">
    <div class="form-card">
      <div class="form-titulo">👥 Registro de Reunião</div>
      <div id="form-reunioes">
        <div class="linha-3">
          <div class="campo"><label>Data</label><input type="date" id="r-data"></div>
          <div class="campo"><label>Horário início</label><input type="time" id="r-inicio"></div>
          <div class="campo"><label>Horário fim</label><input type="time" id="r-fim"></div>
        </div>
        <div class="campo"><label>Tipo de reunião</label>
          <select id="r-tipo"><option value="">Selecione</option><option>Reunião de pais</option><option>Conselho de classe</option><option>Reunião pedagógica</option><option>Reunião com família de aluno</option><option>Formação de professores</option><option>Outro</option></select>
        </div>
        <div class="campo"><label>Pauta / Assunto</label><textarea id="r-pauta" placeholder="Descreva os temas discutidos..."></textarea></div>
        <div class="campo"><label>Participantes</label><textarea id="r-participantes" placeholder="Liste os presentes..." style="min-height:60px;"></textarea></div>
        <div class="campo"><label>Encaminhamentos / Decisões</label><textarea id="r-encaminhamentos" placeholder="O que foi decidido ou encaminhado..."></textarea></div>
        <div class="campo"><label>Responsável pelo registro</label><input type="text" id="r-responsavel" placeholder="Nome do professor ou funcionário"></div>
        <button class="btn-enviar" onclick="enviar('Reunioes', {aba:'Reunioes', data: v('r-data'), horario_inicio: v('r-inicio'), horario_fim: v('r-fim'), tipo: v('r-tipo'), pauta: v('r-pauta'), participantes: v('r-participantes'), encaminhamentos: v('r-encaminhamentos'), responsavel: v('r-responsavel')}, ['r-tipo','r-responsavel'])">Salvar registro</button>
      </div>
      <div class="sucesso" id="suc-reunioes">
        <div class="icone">✅</div>
        <h2>Registro salvo com sucesso!</h2>
        <p id="info-reunioes"></p>
        <p class="protocolo" id="prot-reunioes"></p>
        <button class="btn-novo" onclick="novoRegistro('reunioes')">Novo registro</button>
      </div>
    </div>
  </div>

  <!-- OCORRÊNCIAS -->
  <div class="aba" id="aba-ocorrencias">
    <div class="form-card">
      <div class="form-titulo">📋 Registro de Ocorrência</div>
      <div id="form-ocorrencias">
        <div class="linha-3">
          <div class="campo"><label>Data</label><input type="date" id="o-data"></div>
          <div class="campo"><label>Horário</label><input type="time" id="o-hora"></div>
          <div class="campo"><label>Turno</label>
            <select id="o-turno"><option value="">Selecione</option><option>Manhã</option><option>Tarde</option><option>Integral</option></select>
          </div>
        </div>
        <div class="linha-2">
          <div class="campo"><label>Nome do aluno</label><input type="text" id="o-aluno" placeholder="Nome completo"></div>
          <div class="campo"><label>Turma / Série</label><input type="text" id="o-turma" placeholder="Ex: 5º A"></div>
        </div>
        <div class="campo"><label>Tipo de ocorrência</label>
          <select id="o-tipo"><option value="">Selecione</option><option>Indisciplina em sala</option><option>Bullying / Agressão verbal</option><option>Vandalismo</option><option>Ausência / Evasão</option><option>Problema de saúde</option><option>Outro</option></select>
        </div>
        <div class="campo"><label>Local</label>
          <select id="o-local"><option value="">Selecione</option><option>Sala de aula</option><option>Pátio / Recreio</option><option>Corredor</option><option>Banheiro</option><option>Cantina</option><option>Portão / Entrada</option><option>Outro</option></select>
        </div>
        <div class="campo"><label>Descrição do ocorrido</label><textarea id="o-descricao" placeholder="Descreva o que aconteceu..."></textarea></div>
        <div class="linha-2">
          <div class="campo"><label>Responsável foi comunicado?</label>
            <select id="o-pais"><option value="">Selecione</option><option>Sim</option><option>Não</option><option>Tentativa sem sucesso</option></select>
          </div>
          <div class="campo"><label>Encaminhamento</label>
            <select id="o-encaminhamento"><option value="">Selecione</option><option>Nenhum</option><option>Coordenação</option><option>Direção</option><option>Conselho Tutelar</option><option>UBS / Saúde</option></select>
          </div>
        </div>
        <div class="campo"><label>Responsável pelo registro</label><input type="text" id="o-responsavel" placeholder="Nome do professor ou funcionário"></div>
        <button class="btn-enviar" onclick="enviar('Ocorrencias', {aba:'Ocorrencias', data: v('o-data'), hora: v('o-hora'), turno: v('o-turno'), aluno: v('o-aluno'), turma: v('o-turma'), tipo: v('o-tipo'), local: v('o-local'), descricao: v('o-descricao'), responsavel_comunicado: v('o-pais'), encaminhamento: v('o-encaminhamento'), responsavel: v('o-responsavel')}, ['o-aluno','o-responsavel'])">Salvar registro</button>
      </div>
      <div class="sucesso" id="suc-ocorrencias">
        <div class="icone">✅</div>
        <h2>Registro salvo com sucesso!</h2>
        <p id="info-ocorrencias"></p>
        <p class="protocolo" id="prot-ocorrencias"></p>
        <button class="btn-novo" onclick="novoRegistro('ocorrencias')">Novo registro</button>
      </div>
    </div>
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynrIm7VDgPqpTKdvTnDnJhOAYB0WLXdRLwUfA4qmvB8a_DIwLN34aAFfmnXR6VfWzt/exec';

const hoje = new Date().toISOString().split('T')[0];
['b-data','ba-data','r-data','o-data'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.value = hoje;
});

trocarAba('ocorrencias');

function v(id) {
  const el = document.getElementById(id);
  return el ? el.value : '';
}

function trocarAba(aba) {
  ['brigas','busca','reunioes','ocorrencias'].forEach(a => {
    document.getElementById('aba-' + a).classList.remove('visivel');
    document.getElementById('btn-' + a).classList.remove('ativo');
  });
  document.getElementById('aba-' + aba).classList.add('visivel');
  document.getElementById('btn-' + aba).classList.add('ativo');
}

function enviar(id, dados, obrigatorios) {
  for (const campo of obrigatorios) {
    if (!v(campo)) {
      alert('Preencha todos os campos obrigatórios antes de salvar.');
      document.getElementById(campo).focus();
      return;
    }
  }

  const btn = document.querySelector('#aba-' + id.toLowerCase() + ' .btn-enviar') ||
              document.querySelector('#aba-busca .btn-enviar');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }

  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(dados)
  })
  .then(() => {
    const abas = { Brigas: 'brigas', BuscaAtiva: 'busca', Reunioes: 'reunioes', Ocorrencias: 'ocorrencias' };
    const slug = abas[id] || id.toLowerCase();
    const protocolo = 'OC-' + Date.now().toString().slice(-6);
    const nomeAluno = dados.aluno || dados.aluno1 || dados.tipo || '';
    document.getElementById('info-' + slug).textContent = nomeAluno;
    document.getElementById('prot-' + slug).textContent = 'Protocolo: ' + protocolo;
    document.getElementById('form-' + slug).style.display = 'none';
    document.getElementById('suc-' + slug).style.display = 'block';
  })
  .catch(() => {
    alert('Erro ao salvar. Verifique sua conexão e tente novamente.');
    if (btn) { btn.disabled = false; btn.textContent = 'Salvar registro'; }
  });
}

function novoRegistro(aba) {
  document.getElementById('form-' + aba).style.display = 'block';
  document.getElementById('suc-' + aba).style.display = 'none';
  document.querySelectorAll('#aba-' + aba + ' input[type=text], #aba-' + aba + ' textarea, #aba-' + aba + ' input[type=number]').forEach(el => el.value = '');
  document.querySelectorAll('#aba-' + aba + ' select').forEach(el => el.value = '');
  document.querySelectorAll('#aba-' + aba + ' input[type=date]').forEach(el => el.value = hoje);
  document.querySelector('#aba-' + aba + ' .btn-enviar').disabled = false;
  document.querySelector('#aba-' + aba + ' .btn-enviar').textContent = 'Salvar registro';
}
</script>
</body>
</html>
